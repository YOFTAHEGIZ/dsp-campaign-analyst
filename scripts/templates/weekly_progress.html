<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$subject</title>
</head>
<!-- Layout only. The text is filled in by scripts/send_weekly_progress.py (Python string.Template placeholders).
     Inline styles and one narrow column, so it reads well in Gmail on a phone. -->
<body style="margin:0;padding:0;background:#f4f4f2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f2;">
<tr><td align="center" style="padding:16px 8px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:600px;background:#ffffff;border:1px solid #e6e5e0;border-radius:8px;
              font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
              color:#0b0b0b;font-size:15px;line-height:1.5;">
  <tr><td style="padding:20px 20px 8px;">
    <div style="font-size:13px;color:#52514e;">Weekly progress · $report_date</div>
    <div style="font-size:20px;font-weight:700;margin-top:2px;">AI Campaign Analyst</div>
    <div style="margin-top:12px;padding:10px 12px;border-radius:6px;background:$status_bg;">
      <span style="font-weight:700;color:$status_color;">$status</span>
      <span style="color:#52514e;"> · $status_reason</span>
    </div>
    <div style="font-size:13px;color:#52514e;margin-top:8px;">$timeline</div>
  </td></tr>
  $sections
  <tr><td style="padding:8px 20px 20px;">
    <a href="$dashboard_url" style="display:inline-block;background:#2a78d6;color:#ffffff;text-decoration:none;
       padding:10px 16px;border-radius:6px;font-weight:600;margin:4px 8px 4px 0;">Open the dashboard</a>
    <a href="$repo_url" style="display:inline-block;color:#2a78d6;text-decoration:none;padding:10px 0;
       font-weight:600;">GitHub repo</a>
  </td></tr>
  <tr><td style="padding:12px 20px 18px;border-top:1px solid #e6e5e0;font-size:12px;color:#8a8984;">
    Sent automatically every Friday at 18:00 East Africa Time by GitHub Actions, from this week's commits,
    closed issues and learning log. $sources_note
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
